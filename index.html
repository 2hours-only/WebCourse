<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SmartCinema Skeleton</title>
    <style>
      /* 简单布局，确保容器存在 */
      .main-container {
        display: flex;
        height: 100vh;
      }
      .left-panel {
        width: 200px;
        background: #f0f0f0;
        padding: 10px;
      }
      .cinema-container {
        flex: 1;
        background: #e9e9e9;
        position: relative;
      }
      .right-panel {
        width: 250px;
        background: #f0f0f0;
        padding: 10px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="main-container">
        <!-- 左侧：用户输入 -->
        <div class="left-panel">
          <div id="user-input-area">
            <p>用户输入区</p>
            <select id="age-select">
              <option value="adult">成人</option>
            </select>
            <input
              id="people-count"
              type="number"
              value="2"
              placeholder="人数"
            />
            <button id="recommend-btn">智能推荐</button>
          </div>
          <div id="accessibility-area">
            <h4>无障碍</h4>
            <button id="font-toggle">大字体</button>
          </div>
        </div>

        <!-- 中间：Canvas -->
        <div class="cinema-container">
          <canvas id="cinema-canvas"></canvas>
        </div>

        <!-- 右侧：选座与订单 -->
        <div class="right-panel">
          <div id="recommend-result"><p>推荐结果</p></div>
          <div id="selected-seats"><p>已选座位</p></div>
          <div id="order-info"><p>订单信息</p></div>
          <button id="purchase-btn" disabled>购票</button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app/main.js"></script>
  </body>
</html>
