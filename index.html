<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SmartCinema Skeleton</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/component.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div id="app">
      <!-- 默认显示登录层 -->
      <div id="login-layer">
        <div class="login-box">
          <h2>用户登录</h2>
          <input id="login-username" type="text" placeholder="用户名" />
          <input id="login-password" type="password" placeholder="密码" />
          <button id="login-btn">登录</button>
          <button id="register-btn">注册</button>
        </div>
      </div>

      <!-- 默认隐藏主界面 -->
      <div class="main-container hidden">
        <!-- 用户信息头部 -->
        <div id="user-header">
          <span id="current-username"></span>
          <button id="logout-btn" class="btn btn-secondary">登出</button>
        </div>

        <div class="left-panel">
          <div id="hall-selection-area">
            <label>选择放映厅：</label>
            <select id="hall-select">
              <option value="small">小厅 (100座)</option>
              <option value="medium">中厅 (200座)</option>
              <option value="large">大厅 (300座)</option>
            </select>
          </div>

          <div id="date-selection-area">
            <label>选择观影日期：</label>
            <select id="date-select"></select>
          </div>

          <div id="user-input-area">
            <p>用户输入区</p>
            <select id="age-select">
              <option value="adult">成人</option>
              <option value="teenager">少年 (15岁以下)</option>
              <option value="elderly">老年人 (60岁以上)</option>
            </select>
            <select id="type-select">
              <option value="personal">个人票</option>
              <option value="couple">情侣票</option>
              <option value="family">家庭票</option>
              <option value="group">团体票</option>
            </select>
            <input
              id="people-count"
              type="number"
              value="2"
              placeholder="人数"
              min="1"
            />
            <div id="member-info-area" class="hidden">
              <p>成员信息 (格式: 姓名:年龄,逗号分隔)</p>
              <textarea
                id="member-info"
                rows="4"
                placeholder="如: 张三:20, 李四:12, 王五:65（中英文标点均可）"
              ></textarea>
            </div>
            
            <!-- API Key 输入框 -->
            <div id="api-key-area" style="margin-top: 10px">
              <label for="api-key-input" style="font-size: 12px; color: #666">
                API Key:
              </label>
              <input
                id="api-key-input"
                type="password"
                placeholder="请输入您的API Key"
                style="
                  width: 100%;
                  padding: 8px;
                  margin-top: 5px;
                  border: 1px solid #e0e0e0;
                  border-radius: 4px;
                "
              />
            </div>
            
            <button id="recommend-btn" class="btn btn-primary">智能推荐</button>
            <!-- 修改：测试AI连接按钮改为AI推荐按钮 -->
            <button
              id="ai-recommend-btn"
              class="btn btn-secondary"
              style="margin-top: 10px"
            >
              AI推荐
            </button>
          </div>

          <div id="accessibility-area">
            <h4>无障碍</h4>
            <button id="font-toggle" class="btn btn-secondary">大字体</button>
          </div>
        </div>

        <div class="cinema-container">
          <canvas id="cinema-canvas"></canvas>
        </div>

        <div class="right-panel">
          <div id="recommend-result"><p>推荐结果</p></div>
          <div id="selected-seats"><p>已选座位</p></div>
          <div id="order-info"><p>订单信息</p></div>
          <button id="purchase-btn" class="btn btn-primary" disabled>
            购票
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app/main.js"></script>
  </body>
</html>
